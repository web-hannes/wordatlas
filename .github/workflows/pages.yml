# Publishes public/ to GitHub Pages on every push to main.
# The data in public/data is built locally (make data) and committed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check today's puzzle exists
        run: |
          today=$(date -u +%F)
          test -f "public/data/days/$today.json" || { echo "::error::No puzzle file for $today. Raise DAYS in pipeline/build.py and run make data."; exit 1; }
          last=$(ls public/data/days | sort | tail -1)
          echo "Puzzles available until ${last%.json}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
