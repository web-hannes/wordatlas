<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordatlas debug</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:ital,opsz,wght@1,8..60,400..600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    main { max-width: 1400px; }
    .dbg-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 0 24px; }
    .dbg-head h1 { margin: 0 12px 0 0; font-size: 28px; letter-spacing: -0.03em; }
    .dbg-head input { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); }
    .dbg-head .btn { min-height: 40px; padding: 0 14px; font-size: 15px; }
    .dbg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 28px; }
    .dbg-card h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
    .dbg-card p { margin: 2px 0 10px; color: var(--ink-2); font-size: 14px; }
    .dbg-card .sheet { width: 100%; }
    .dbg-err { color: var(--t-far); }
  </style>
</head>
<body>
  <main>
    <div class="dbg-head">
      <h1>Debug</h1>
      <input type="date" aria-label="Day">
      <a class="btn btn-quiet" data-step="-1" href="#">Previous day</a>
      <a class="btn btn-quiet" data-step="1" href="#">Next day</a>
      <a class="btn btn-quiet" href="./">Back to the game</a>
    </div>
    <div class="dbg-grid"></div>
  </main>
  <script type="module" src="js/debug.js"></script>
</body>
</html>
